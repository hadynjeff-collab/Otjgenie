<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Off-the-Job Genie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--black:#080808;--white:#f5f5f4;--dim:#9b9b9b;--line:#303030}
  *{box-sizing:border-box}
  body{
    background:var(--black);color:var(--white);margin:0;
    font:16px/1.65 Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

  /* Welcome screen layout */
  .intro{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:64px 24px 56px;
  }
  .intro-copy{margin-bottom:46px}
  .intro .welcome-course-title{
    font:500 16px/1.5 Montserrat,Arial,sans-serif;
    letter-spacing:-.02em;
    color:#b8b8b8;
    margin:0 0 12px;
  }
  .intro h1{
    font:600 clamp(44px,5.4vw,76px)/1 Montserrat,sans-serif;
    letter-spacing:-.055em;
    color:var(--white);
    margin:0;
  }
  .intro h1 span{display:block}
  .intro h1 span + span{color:var(--dim)}
  .intro .sub{font:400 16px/1.65 Roboto,Arial,sans-serif;color:#999;margin:34px 0 0}

  /* ---- Branches: from Modium source ---- */
  .path-branch{width:min(100%,var(--w,764px));margin:0 auto 20px}
  .path-branch svg{display:block;width:100%;height:auto;overflow:visible}
  .path-branch path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .path-branch .route-base{stroke:#404040;stroke-width:2}
  .path-branch .route-glow{stroke:#fff;stroke-width:3;stroke-dasharray:18 100;stroke-dashoffset:18;opacity:0;filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 9px rgba(255,255,255,.55))}
  .path-branch .start-node{fill:#eee;filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}
  .path-branch .branch-end{fill:#666;transition:fill .2s,filter .2s}
  .path-branch .route-glow.is-travel{animation:pathPulse 1.1s linear both}
  .path-branch .route-glow.is-highlight{animation:none;stroke-dasharray:none;opacity:1}
  .path-branch .branch-end.is-highlight{fill:white;filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}
  @keyframes pathPulse{0%{stroke-dashoffset:18;opacity:0}8%{opacity:1}86%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}

  /* ---- Choice buttons: from Modium source ---- */
  .choice-grid{display:grid;grid-template-columns:repeat(var(--cols,4),170px);gap:var(--gap,28px);width:var(--w,764px);max-width:100%;margin:0 auto}
  .choice{color:white;background:transparent;text-align:left;border:1px solid #353535;border-radius:14px;min-height:126px;padding:23px;transition:background .2s,border-color .2s,transform .2s;cursor:pointer;font:inherit}
  .choice:hover{background:#171717;border-color:#777;transform:translateY(-2px)}
  .choice h2{font:600 27px Montserrat,sans-serif;letter-spacing:-.04em;margin:0 0 9px}
  .choice p{font-size:13px;line-height:1.45;color:#919191;margin:0}
  .choice{display:flex;align-items:center;justify-content:center;text-align:center}
  .choice h2{margin:0}
  @media(max-width:760px){
    .intro{min-height:calc(100svh - 70px);padding:52px 24px}
    .intro-copy{margin-bottom:26px}
    .path-branch{max-width:280px;margin:0 auto 18px}
    .choice-grid{grid-template-columns:1fr;gap:10px;max-width:440px;width:100%;margin:0 auto}
    .choice{min-height:auto;padding:17px 21px}
    .choice h2{font-size:22px;margin:0 0 4px}
  }
  .choice h2{margin:0}
  /* Four-option layout: longer two-line labels */
  .choice{padding:16px}
  .choice h2{font-size:22px;line-height:1.15}
  @media(max-width:760px){.start-grid{grid-template-columns:1fr}.choice{padding:17px 21px}.choice h2{font-size:20px}.choice h2 br{display:none}}
  /* Step transitions */
  .stage{display:flex;flex-direction:column;align-items:center;width:100%;transition:opacity .4s ease,transform .4s ease}
  .stage.is-leaving{opacity:0;transform:translateY(-14px)}
  .stage.is-entering{opacity:0;transform:translateY(14px);transition:none}
  .done-note{font:400 16px/1.65 Roboto,Arial,sans-serif;color:#999;margin:26px 0 0}
  .restart{margin-top:28px;background:transparent;border:1px solid #353535;color:#fff;border-radius:10px;padding:11px 20px;font:500 14px Roboto,Arial,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
  .restart:hover{background:#171717;border-color:#777}
  @media(prefers-reduced-motion:reduce){.stage{transition:none}}
  /* Follow-the-branch transition */
  .intro{position:relative;overflow:hidden}
  .stage{position:relative}
  .stage-incoming{position:absolute;inset:0;padding:inherit;justify-content:center}
  .stage.is-departing .intro-copy,.stage.is-departing .choice:not(.is-chosen),.stage.is-departing .route-base,
  .stage.is-departing .route-glow,.stage.is-departing .branch-end,.stage.is-departing .start-node{opacity:0;transition:opacity .35s ease}
  .start-grid{margin-top:10px;grid-template-columns:220px;justify-content:center}
  .start-grid .choice{min-height:84px}
  .choice.is-chosen{background:#171717;border-color:#777}
  .stage.is-fading-trail .choice.is-chosen{opacity:0;transition:opacity .45s ease}
  .stage-incoming .intro-copy,.stage-incoming .choice,.stage-incoming .route-base,.stage-incoming .branch-end,.stage-incoming .restart{opacity:0}
  .stage-incoming.is-arrived .intro-copy,.stage-incoming.is-arrived .choice,.stage-incoming.is-arrived .route-base,
  .stage-incoming.is-arrived .branch-end,.stage-incoming.is-arrived .restart{opacity:1;transition:opacity .5s ease}
  .stage-incoming .start-node{opacity:0;transition:opacity .25s ease}
  .stage-incoming.node-in .start-node{opacity:1}
  /* Branch from the button splits straight into the next question's paths */
  .stage.is-splitting .route-base{opacity:1;stroke-dasharray:100 100;animation:drawPath .7s cubic-bezier(.25,.7,.35,1) both}
  .stage.is-splitting .route-glow{opacity:1;stroke-dasharray:100 100;animation:drawPath .7s cubic-bezier(.25,.7,.35,1) both,glowOut .55s .75s ease forwards}
  .stage.is-splitting .branch-end{opacity:1;transition:opacity .3s .5s ease}
  .stage-incoming.is-arrived .choice{transition:opacity .5s .4s ease}
  .stage-incoming.is-arrived.is-splitting .intro-copy{transition:opacity .5s .3s ease}
  @keyframes drawPath{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  @keyframes glowOut{to{opacity:0}}
  .flood{position:fixed;inset:0;background:#f3f3f1;z-index:6;pointer-events:none}
  .follow-line{position:absolute;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;
    box-shadow:0 0 4px rgba(255,255,255,.95),0 0 9px rgba(255,255,255,.55);transform-origin:top;transform:scaleY(0);pointer-events:none}
  /* ---------- Dashboard (light theme, colours from Modium player theme) ---------- */
  html,body{transition:background-color .7s ease,color .7s ease}
  body.is-light{background:#f3f3f1;color:#171717;color-scheme:light}
  .intro.is-dash{justify-content:flex-start;padding-top:128px}
  .stage.dash-incoming{justify-content:flex-start}
  .stage-incoming .dash-body{opacity:0}
  .stage-incoming.is-arrived .dash-body{opacity:1;transition:opacity .5s .35s ease}
  .dash{width:100%;max-width:1080px;margin:0 auto;text-align:left;color:#171717}
  .dash-head{text-align:center;margin-bottom:56px}
  .intro .dash-head h1{font-size:clamp(34px,4.2vw,52px);line-height:1.05;color:#151515;transition:color .7s ease}
  .intro .dash-head h1 span+span{color:#9b9b9b}
  .dash-basis{font-size:15px;color:#555;margin:18px 0 0}
  .dash-basis strong{font-weight:500;color:#171717}
  .link-btn{background:none;border:0;padding:0;color:#171717;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .link-btn:hover{color:#555}
  .dash-progress{max-width:360px;margin:26px auto 0}
  .dash-progress-label{display:flex;justify-content:center;font-size:12px;font-weight:500;color:#444;margin:0 0 9px}
  .progress-track{display:block;height:3px;background:#d5d5d5;border-radius:10px;overflow:hidden}
  .progress-fill{height:100%;width:0;background:#171717;transition:width .3s ease}
  .dash-section{margin-bottom:56px}
  .dash-section-head{text-align:center;margin-bottom:22px}
  .dash-section-head p{margin:6px 0 0;font-size:14px;color:#6b6b6b}
  .dash-section-head h2{font:600 22px Montserrat,sans-serif;letter-spacing:-.035em;margin:0;color:#151515}
  .dash-filters{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:fit-content;max-width:100%;margin:0 auto 26px;padding:14px;background:#fff;border:1px solid #e3e3e1;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .filter{display:flex;flex-direction:column;gap:6px;min-width:180px}
  .filter-label{font:500 11px Montserrat,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#898989}
  .select-wrap{position:relative;display:block}
  .select-wrap::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.7px solid #333;border-bottom:1.7px solid #333;transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .filter select{appearance:none;-webkit-appearance:none;width:100%;background:#f6f6f5;border:1px solid #e0e0de;border-radius:10px;padding:11px 40px 11px 14px;font:500 14px Roboto,Arial,sans-serif;color:#171717;cursor:pointer;transition:border-color .2s}
  .filter select:hover{border-color:#777}
  .filter select:focus-visible{outline:3px solid #222;outline-offset:2px}
  .act-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:16px;align-items:stretch}
  .act{border:1px solid #e3e3e1;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .2s,box-shadow .2s}
  .act:hover{border-color:#a8a8a8}
  .act.is-rec{border-color:#bcbcbc}
  .act{display:flex}
  .act-summary{display:flex;flex-direction:column;width:100%;height:100%;text-align:left;background:none;border:0;padding:22px;color:inherit;font:inherit;cursor:pointer;border-radius:14px}
  .act-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:18px;margin-bottom:10px}
  .act-rank{display:inline-flex;align-items:center;gap:7px;font:500 12px Roboto,Arial,sans-serif;color:#171717}
  .act-rank i{width:7px;height:7px;border-radius:50%;background:#171717;box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .act-done{display:inline-flex;align-items:center;gap:5px;font:500 12px Roboto,Arial,sans-serif;color:#171717;background:#efefef;border-radius:999px;padding:3px 9px 3px 7px}
  .act-done svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .act-title{font:600 18px/1.25 Montserrat,sans-serif;letter-spacing:-.03em;color:#151515;margin-bottom:6px}
  .act-sum{font-size:14px;line-height:1.55;color:#555;margin-bottom:18px;flex:1}
  .act-meta{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:16px;font-size:13px;color:#505050}
  .act-meta>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .act-meta svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .act-chev{margin-left:auto}
  .act-meta .act-done{margin-left:auto;gap:5px}
  .act-meta .act-done+.act-chev{margin-left:0}
  .act-chev svg{width:17px;height:17px;transition:transform .25s ease}
  .act-summary:hover .act-chev svg{transform:translateX(3px)}
  .act{transition:border-color .2s,box-shadow .2s,transform .2s}
  .act:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
  .act.is-lifted{visibility:hidden}
  .act.is-done .act-title,.act.is-done .act-sum{color:#8a8a8a}
  .act-btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:#191919;border:1px solid #191919;color:#fff;border-radius:8px;padding:11px 20px;font:500 14px Roboto,Arial,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
  .act-btn:hover{background:#383838;border-color:#383838}
  .act-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .act-btn[aria-pressed="true"]{background:#fff;color:#1d1d1d;border-color:#777}
  .act-btn[aria-pressed="true"]:hover{background:#eee;border-color:#222}
  body.is-light .chip:focus-visible,body.is-light .act-btn:focus-visible,body.is-light .link-btn:focus-visible,body.is-light .act-summary:focus-visible{outline:3px solid #222;outline-offset:3px}
  .choice:focus-visible{outline:2px solid #eee;outline-offset:3px}
  /* Navigation bar */
  .topnav{position:fixed;top:0;left:0;right:0;z-index:45;height:64px;background:#fff;border-bottom:1px solid #e3e3e1;transform:translateY(-100%);transition:transform .45s cubic-bezier(.2,.75,.2,1)}
  .topnav.is-shown{transform:none}
  .topnav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.5vw,40px)}
  .brand{display:inline-flex;align-items:center;gap:11px;color:#151515}
  .brand-mark{width:34px;height:34px;flex:none}
  .brand-mark rect{fill:#080808}
  .brand-mark path{fill:none;stroke:#b8b8b8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .brand-mark circle{fill:#d6d6d6}
  .brand-mark .n0{fill:#fff}
  .brand-name{font:600 18px Montserrat,sans-serif;letter-spacing:-.04em}
  .brand-name span{color:#9b9b9b}
  .nav-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d7d7d5;border-radius:999px;padding:8px 15px;font:500 14px Roboto,Arial,sans-serif;color:#1d1d1d;cursor:pointer;transition:background .2s,border-color .2s}
  .nav-btn:hover{background:#f3f3f1;border-color:#999}
  .nav-btn:focus-visible{outline:3px solid #222;outline-offset:2px}
  .nav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-btn-short{display:none}
  @media(max-width:480px){.nav-btn-long{display:none}.nav-btn-short{display:inline}.brand-name{font-size:16px}}
  @media(prefers-reduced-motion:reduce){.topnav{transition:none}}
  @media(max-width:760px){.intro.is-dash{padding-top:100px}.dash-filters{width:100%}.filter{flex:1 1 100%;min-width:0}}
  /* Detail panel */
  html.dp-lock{overflow:hidden}
  .sb{position:fixed;z-index:41;top:64px;right:0;height:calc(100vh - 64px);height:calc(100dvh - 64px);width:min(440px,100vw);background:#fff;border-left:1px solid #dedede;
    box-shadow:-18px 0 50px rgba(0,0,0,.05);color:#171717;overflow-y:auto;overscroll-behavior:contain;
    transform:translateX(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.75,.2,1),visibility 0s .45s}
  body.sb-open .sb{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.75,.2,1),visibility 0s}
  .sb-backdrop{display:none}
  body.is-light .intro.is-dash{transition:padding-right .45s cubic-bezier(.2,.75,.2,1)}
  @media(min-width:761px){body.sb-open .intro.is-dash{padding-right:464px}}
  @media(min-width:761px) and (max-width:1200px){body.sb-open .act-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:761px) and (max-width:960px){body.sb-open .act-grid{grid-template-columns:1fr}}
  .act.is-active{border-color:#171717;box-shadow:0 0 0 1px #171717}
  .act.is-active:hover{transform:none}
  .sb .dp-inner{padding:30px 32px 40px}
  .dp-inner{overflow:auto;padding:30px 34px 28px;width:100%;overscroll-behavior:contain}
  .dp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .dp-style{font:500 11px Montserrat,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#898989}
  .dp-close{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid #dedede;background:#fff;color:#1c1c1c;cursor:pointer;transition:background .2s,border-color .2s}
  .dp-close:hover{background:#f2f2f2;border-color:#bbb}
  .dp-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .dp-title{font:600 clamp(24px,3vw,30px)/1.15 Montserrat,sans-serif;letter-spacing:-.04em;margin:0 0 8px;color:#151515}
  .dp-sum{font-size:16px;line-height:1.6;color:#4c4c4c;margin:0 0 16px}
  .dp-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .dp-meta span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#353535;background:#f3f3f3;border-radius:999px;padding:6px 12px}
  .dp-meta svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dp-h{font:500 11px Montserrat,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#898989;margin:0 0 14px}
  .dp-steps{list-style:none;margin:0 0 30px;padding:0;position:relative}
  .dp-steps li{position:relative;display:flex;gap:16px;padding:0 0 18px;font-size:15px;line-height:1.55;color:#252525;
    animation:stepIn .45s calc(.32s + var(--i)*.09s) both ease-out}
  .dp-steps li:last-child{padding-bottom:0}
  .dp-steps li::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:2px;background:#d4d4d4}
  .dp-steps li:last-child::before{display:none}
  .dp-node{flex:0 0 12px;height:12px;margin-top:5px;border-radius:50%;background:#fff;border:2px solid #171717;position:relative;z-index:1}
  @keyframes stepIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .dp-cols{display:grid;grid-template-columns:1fr;gap:24px;padding:22px 0 0;border-top:1px solid #e6e6e6;margin-bottom:26px}
  .dp-cols p{font-size:15px;line-height:1.6;color:#353535;margin:0}
  .dp-foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .dp-back{background:none;border:0;padding:0;font:500 14px Roboto,Arial,sans-serif;color:#4c4c4c;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .dp-back:hover{color:#171717}
  .act-btn.pop{animation:pop .35s ease}
  @keyframes pop{40%{transform:scale(1.05)}}
  .sb button:focus-visible{outline:3px solid #222;outline-offset:3px}
  @media(max-width:760px){
    .sb{top:auto;bottom:0;width:100%;height:auto;max-height:88vh;border-left:0;border-radius:20px 20px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.18);transform:translateY(100%)}
    body.sb-open .sb{transform:none}
    .sb-backdrop{display:block;position:fixed;inset:0;z-index:40;background:rgba(20,20,20,.28);opacity:0;pointer-events:none;transition:opacity .35s ease}
    body.sb-open .sb-backdrop{opacity:1;pointer-events:auto}
    .dp-inner{padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
    .dp-cols{grid-template-columns:1fr;gap:18px}
  }
  @media(prefers-reduced-motion:reduce){.dp-steps li{animation:none}.act:hover{transform:none}}
  .dash-empty{grid-column:1/-1;color:#555;font-size:14px;margin:8px 0;text-align:center}
  @media(max-width:900px){.act-grid,.rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:760px){.act-grid,.rec-grid{grid-template-columns:minmax(0,1fr)}.dash-head{margin-bottom:40px}.dash-section{margin-bottom:44px}.filter{align-items:stretch;flex-direction:column;gap:6px}}

  /* ---------- Polish pass: quieter interface ---------- */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .intro.is-dash{padding-top:112px}
  .dash{max-width:1040px}
  .dash-section{margin-bottom:64px}
  .dash-section-head{text-align:center;margin-bottom:20px}
  .dash-section-head h2{font:600 20px Montserrat,sans-serif;letter-spacing:-.035em;color:#151515}
  .dash-filters{background:none;border:0;box-shadow:none;padding:0;gap:10px;margin:0 auto 22px}
  .filter{min-width:0;gap:0}
  .filter select{background:#fff;border:1px solid #e0e0de;border-radius:999px;padding:9px 38px 9px 16px;font:500 14px Roboto,Arial,sans-serif;color:#1d1d1d}
  .filter select:hover{border-color:#b9b9b7}
  .select-wrap::after{right:16px;width:6px;height:6px;border-width:0 1.5px 1.5px 0;border-color:#555}
  .act{border-color:#e6e6e4;box-shadow:none}
  .act:hover{transform:none;border-color:#cfcfcd;box-shadow:0 6px 20px rgba(0,0,0,.05)}
  .act-summary{padding:22px 22px 20px}

<main class="intro" id="intro">
  <div class="stage" id="stage"></div>
</main>

<script>
const $=id=>document.getElementById(id);

/* Question flow. Each answer leads straight into the next question. */
const steps=[
  {id:'start',start:true,lines:['Off-the-Job Training,','Your Way'],button:'Get started'},
  {id:'style',lines:['How do you','prefer to learn?'],options:[
    {key:'visual',label:'Visual &amp; <br>Shadowing'},
    {key:'discussion',label:'Discussion &amp; <br>Verbal'},
    {key:'reading',label:'Reading &amp; <br>Writing'},
    {key:'practical',label:'Hands-on &amp; <br>Practical'}]},
  {id:'autonomy',lines:['How do you','usually work?'],options:[
    {key:'guided',label:'With clear <br>guidance'},
    {key:'independent',label:'Mostly on <br>my own'}]}
];
const answers={};
let stepIndex=0,busy=false;

/* Geometry: same card size and curve shape as the original branches. */
const CARD=170,TOP=10,FORK=74,END=146;
function layout(n){
  const gap=n>3?28:52,w=n*CARD+(n-1)*gap,mid=w/2;
  const xs=[...Array(n)].map((_,i)=>CARD/2+i*(CARD+gap));
  const paths=xs.map(x=>{
    if(Math.abs(x-mid)<1)return `M${mid} ${TOP}V${END}`;
    const ctrl=mid-(mid-x)*(105/218);
    return `M${mid} ${TOP}V${FORK}C${mid} 105 ${ctrl.toFixed(1)} 141 ${x} ${END}`;
  });
  return {gap,w,mid,xs,paths};
}

function render(step){
  $('stage').innerHTML=stepMarkup(step);
  bindChoices(step);
  if(!step.start)playIntroBranchSequence(step.options.map(o=>o.key));
}
function stepMarkup(step){
  if(step.start)return `
    <div class="intro-copy"><h1><span>${step.lines[0]}</span><span>${step.lines[1]}</span></h1>
</div>
    <div class="choice-grid start-grid" style="--cols:1;--gap:0px;--w:220px"><button class="choice" data-start="begin"><h2>${step.button}</h2></button></div>`;
  const n=step.options.length,g=layout(n);
  const base=g.paths.map(d=>`<path class="route-base" d="${d}" pathLength="100"></path>`).join('');
  const glow=g.paths.map((d,i)=>`<path class="route-glow" data-mode="${step.options[i].key}" d="${d}" pathLength="100"></path>`).join('');
  const ends=g.xs.map((x,i)=>`<circle class="branch-end" data-mode="${step.options[i].key}" cx="${x}" cy="${END}" r="5"></circle>`).join('');
  const btns=step.options.map(o=>`<button class="choice" data-start="${o.key}"><h2>${o.label}</h2></button>`).join('');
  return `
    <div class="intro-copy"><h1><span>${step.lines[0]}</span><span>${step.lines[1]}</span></h1></div>
    <div aria-hidden="true" class="path-branch" style="--w:${g.w}px">
      <svg focusable="false" viewBox="0 0 ${g.w} 170">${base}${glow}<circle class="start-node" cx="${g.mid}" cy="${TOP}" r="6"></circle>${ends}</svg>
    </div>
    <div class="choice-grid" style="--cols:${n};--gap:${g.gap}px;--w:${g.w}px">${btns}</div>`;
}

function renderDone(){
  $('stage').innerHTML=doneMarkup();
  $('intro').classList.add('is-dash');document.body.classList.add('is-light');
  showNav();bindDone();
}

/* ---------- Navigation bar (interface layer) ---------- */
const LOGO_PATHS={a:'M19 9V16C19 21 12.5 24 10 29',b:'M19 9V29',c:'M19 9V16C19 21 25.5 24 28 29'};
const LOGO=`<span class="brand-mark" id="brandMark"><svg viewBox="5 4 28 30" aria-hidden="true">
  ${Object.values(LOGO_PATHS).map(d=>`<path class="lg-base" d="${d}"/>`).join('')}
  ${Object.entries(LOGO_PATHS).map(([k,d])=>`<path class="lg-pulse lg-${k}" d="${d}" pathLength="100"/>`).join('')}
  <circle cx="19" cy="9" r="2.4" class="lg-start"/><circle cx="10" cy="29" r="2.1" class="lg-end"/><circle cx="19" cy="29" r="2.1" class="lg-end"/><circle cx="28" cy="29" r="2.1" class="lg-end"/></svg></span>`;
/* Logo trail: each branch lights in turn, like the welcome screen, then rests before repeating */
let logoTimers=[];
function playLogo(){
  logoTimers.forEach(clearTimeout);logoTimers=[];
  const m=$('brandMark');if(!m||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  ['a','b','c'].forEach((k,i)=>logoTimers.push(setTimeout(()=>{delete m.dataset.travel;void m.offsetWidth;m.dataset.travel=k},500+i*1300)));
  logoTimers.push(setTimeout(()=>delete m.dataset.travel,500+3*1300));
  logoTimers.push(setTimeout(playLogo,500+3*1300+1500));

X("d32","either",60,"others","scale","K9 K17 B4 S9","Debate a discretionary service charge","Discuss with peers whether your venue should add one.",

X("d35","either",45,"others","flag","K7 K10 S10 B10","Talk security with your door or security lead","Learn how your venue prevents and responds to incidents.",

["Arrange a conversation with your security lead, door supervisor or the person responsible for Martyn’s Law readiness.","Ask about common incidents and how they’re prevented.","Ask what the venue’s procedures are for evacuation, invacuation, lockdown and communication.","Ask what they need from managers and the team.","Write down three things you’ll brief your team on."],

X("d36","either",60,"others","compass","K3 K18 B17","Talk market trends with a local business network","Speak to a tourism body, BID or business network about your local market.",

X("d37","either",60,"others","mountain","K11 S11 B19 B3","Hold stay conversations","Ask team members what would keep them with you.",

X("d38","either",45,"others","laptop","K8 B8 B20 S3","Pitch a technology idea","Research a technology and pitch it to your management team.",

["Identify a problem technology might solve (queues, ordering, waste tracking, rota planning, energy).","Research two options and compare cost, benefits and risks, including data protection.","Prepare a five-minute pitch with a recommendation and a trial plan.","Present it to your manager or management team.","Note the questions asked and refine the proposal."],
["What problem were you solving?","What risks did the managers focus on?","How would you measure success?"]),
X("d39","either",60,"others","chats","B11 K19 S19","Run a peer learning circle","Meet other apprentices or junior managers to share leadership challenges.",

X("d40","either",20,"others","star","B19 S19 B1 B12","Recognise great work out loud","Give specific, public recognition for behaviour that reflects your standards.",

X("d41","either",45,"others","folder","K9 S9 B9 K13","Talk data protection with your DPO","Learn how guest and staff data must be handled.",

X("d43","guided",180,"others","mountain","K19 B11 S19","Mentoring sessions on a leadership goal","Three planned mentoring conversations with a senior manager.",

["Agree a mentor with your manager and choose one leadership goal (for example delegating, handling conflict, motivating a team).","Hold three one-hour sessions over six to eight weeks.","Before each session, prepare an example from your recent work.","After each, agree one action to try before the next session.","At the end, write a summary of what you’ve learned and what has changed."],

X("d45","guided",60,"others","scale","S13 K13 B9","Plan a difficult conversation with HR","Prepare for a real conversation using Acas guidance.",

X("d48","guided",60,"others","users","K20 S20 B20","Plan stakeholder conversations for a change","Prepare, with your manager, how to discuss a change with everyone affected.",

X("d49","guided",45,"others","heart","K21 S21 K13","Discuss reasonable adjustments with HR","Learn how to respond when a team member asks for support.",

["Arrange a conversation with HR.","Prepare two or three scenarios (for example a request linked to a health condition, a religious observance or a caring responsibility).","Discuss how you should respond, what the law requires and what the business can offer.","Ask about confidentiality and record keeping.","Write a short guide for yourself."],

X("d52","independent",180,"others","compass","K1 K3 B17 B11","Informational interviews with other managers","Talk to managers in three different hospitality businesses.",

X("d53","independent",20,"solo","mic","B11 K19","Record a weekly leadership reflection","Record a short voice note each week about a leadership moment.",

X("d56","independent",20,"others","flag","K10 S10 B10 B12","Deliver a toolbox talk on slips and trips","Lead a short safety talk for your team.",

X("r1","either",90,"solo","doc","K9 K5 S9 B9","Write an allergen gap analysis","Read the FSA’s allergen guidance and compare it with your process.",

["Read the [Code of practice on fair and transparent distribution of tips](https://www.gov.uk/government/publications/distributing-tips-fairly-statutory-code-of-practice).","Read your venue’s written tipping policy.","Write a one-page explainer for the team covering: what counts as a tip, how they’re shared here, when they’re paid and how to request the tipping record.","Ask your manager to check it for accuracy.","Share it with the team and note the questions they ask."],

X("r3","either",90,"solo","scale","K9 K10 K21 S10 B21","Write an action plan on third-party harassment","Read the EHRC checklist and plan how to protect your team.",
"Employers have a legal duty to prevent sexual harassment of their workers, including by customers. From 30 October 2026, the Employment Rights Act 2025 strengthened this to taking “all reasonable steps”. Hospitality staff face particular risks from guests.",
["Read the EHRC’s [Preventing sexual harassment at work: checklist and action plan for employers](https://www.equalityhumanrights.com/guidance/preventing-sexual-harassment-work-checklist-and-action-plan-employers).","Identify where in your venue staff are most at risk (late shifts, lone working, private dining, room service, bar).","Write an action plan covering before, during and after shifts, using the checklist’s structure.","Include how staff report incidents and how guests who harass staff are dealt with.","Share the draft with your manager or HR."],
["Where are your team most vulnerable?","Would your team feel confident to report an incident?","How will you show zero tolerance as a leader?"]),
X("r4","either",60,"solo","flag","K7 K9 S7 B10","Is your venue in scope of Martyn’s Law?","Read the government factsheet and write a short briefing.",
"The Terrorism (Protection of Premises) Act 2025, known as Martyn’s Law, places duties on venues expecting 200 or more people at the same time. Understanding whether your venue is in scope, and which tier, helps you prepare.",
["Read the [Martyn’s Law overarching factsheet](https://www.gov.uk/government/publications/terrorism-protection-of-premises-act-2025-factsheets/terrorism-protection-of-premises-act-2025-overarching-factsheet).","Work out your venue’s likely maximum number of people at once (including staff) and whether it falls into the standard tier (200–799) or enhanced tier (800+).","List the public protection procedures the standard tier requires: evacuation, invacuation, lockdown and communication.","Note what your venue already has and what’s missing, and check the current commencement date on GOV.UK.","Write a one-page briefing for your manager."],
["Which tier is your venue likely to be in?","Which procedure is least developed?","How would you train the team?"]),
X("r5","either",90,"solo","book","K9 S9 B9 B5","Write how you promote the licensing objectives","Read the section 182 guidance and apply it to your venue.",

X("r6","either",90,"solo","checklist","K10 S10 B10","Review a risk assessment","Read HSE guidance and improve one of your venue’s risk assessments.",

X("r8","either",120,"solo","leaf","K2 K9 S2 B2 S1","Write a food waste reduction proposal","Use WRAP’s toolkit to write a costed proposal.",

/* ---------- SCORM persistence ----------
   Nothing is kept in the browser. Preferences and progress are saved to the LMS
   in cmi.suspend_data (SCORM 2004 or 1.2). Outside an LMS, progress lasts for the
   current session only. */
const SCORM=(()=>{
  let api=null,ver=null,live=false,timer=null,lastSaved='';
  function scan(w){let n=0;try{while(w&&n<12){if(w.API_1484_11){return [w.API_1484_11,'2004']}if(w.API){return [w.API,'1.2']}if(!w.parent||w.parent===w)break;w=w.parent;n++}}catch(e){}return null}
  function find(){let r=scan(window);if(!r&&window.opener){r=scan(window.opener)}if(!r){try{if(window.top&&window.top.opener)r=scan(window.top.opener)}catch(e){}}return r}
  const call=(m12,m04,...args)=>{try{return ver==='2004'?api[m04](...args):api[m12](...args)}catch(e){return ''}};
  function init(){
    const r=find();if(!r)return;[api,ver]=r;
    const ok=String(call('LMSInitialize','Initialize',''));live=ok==='true'||ok==='1';
    if(!live)return;
    /* Ask the LMS to keep suspend_data for the next session */
    call('LMSSetValue','SetValue',ver==='2004'?'cmi.exit':'cmi.core.exit','suspend');
    const st=String(call('LMSGetValue','GetValue',ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status',''));
    if(st==='not attempted'||st==='unknown'||st==='')call('LMSSetValue','SetValue',ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status','incomplete');
    call('LMSCommit','Commit','');
  }
  function read(){if(!live)return null;const raw=String(call('LMSGetValue','GetValue','cmi.suspend_data')||'');if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}
  function write(str,now){
    if(!live||str===lastSaved)return;
    clearTimeout(timer);
    const go=()=>{call('LMSSetValue','SetValue','cmi.suspend_data',str);call('LMSCommit','Commit','');lastSaved=str};
    if(now)go();else timer=setTimeout(go,400);
  }
  function finish(str){if(!live)return;clearTimeout(timer);write(str,true);call('LMSFinish','Terminate','');live=false}
  init();
  return {read,write,finish,get live(){return live},get version(){return ver}};
})();

/* Compact state, well under SCORM 1.2's 4,096-character suspend_data limit */
let completed=new Set(),doneAt={},viewed=new Set(),featDone=new Set(),usedFinder=false,savedPrefs=null;
(function restore(){
  const d=SCORM.read();if(!d||d.v!==1)return;
  if(d.p&&d.p.s&&d.p.f)savedPrefs={style:d.p.s,autonomy:d.p.f};
  Object.entries(d.c||{}).forEach(([id,t])=>{if(activities.some(a=>a.id===id)){completed.add(id);doneAt[id]=parseInt(t,36)*1000}});
  (d.w||[]).forEach(id=>viewed.add(id));(d.ft||[]).forEach(id=>featDone.add(id));usedFinder=!!d.pf;
})();
function stateString(){
  const c={};completed.forEach(id=>c[id]=Math.round((doneAt[id]||Date.now())/1000).toString(36));
  const p=answers.style&&answers.autonomy?{s:answers.style,f:answers.autonomy}:savedPrefs?{s:savedPrefs.style,f:savedPrefs.autonomy}:null;
  return JSON.stringify({v:1,p,c,w:[...viewed],ft:[...featDone],pf:usedFinder?1:0});
}
function persist(now){SCORM.write(stateString(),now)}
function saveCompleted(){persist()}
function saveExtra(){persist()}

/* How many actions the learner still needs for a badge: activities to complete,
   activities to look through, or a KSB search. Uses the activities actually left
   in their dashboard, so "closest" means quickest to earn, not highest percentage. */
function coverSteps(cov,deficit){
  const pool=myActivities().filter(a=>!completed.has(a.id));const c=new Set(cov);let steps=0;
  while(deficit(c)>0){
    let best=null,gain=0;
    for(const a of pool){if(a.used)continue;const t=new Set(c);a.ksbs.forEach(k=>t.add(k));const g=deficit(c)-deficit(t);if(g>gain){gain=g;best=a}}
    if(!best){pool.forEach(a=>delete a.used);return Infinity}
    best.used=true;best.ksbs.forEach(k=>c.add(k));steps++;
  }
  pool.forEach(a=>delete a.used);return steps;
}
function stepsLeft(b,st){
  const left=Math.max(0,b.goal-b.val(st));if(!left)return 0;
  const todo=myActivities().filter(a=>!completed.has(a.id));
  const need=(p,n)=>c=>Math.max(0,n-[...c].filter(k=>k[0]===p).length);
  switch(b.id){
    case 'know':return coverSteps(st.cov,need('K',b.goal));
    case 'skill':return coverSteps(st.cov,need('S',b.goal));
    case 'role':return coverSteps(st.cov,need('B',b.goal));
    case 'full':return coverSteps(st.cov,c=>Math.max(0,b.goal-c.size));
    case 'balance':return coverSteps(st.cov,c=>need('K',5)(c)+need('S',5)(c)+need('B',5)(c));
    case 'quick':return todo.some(a=>a.mins<=30)?1:Infinity;
    case 'deep':return todo.some(a=>a.mins>=60)?1:Infinity;
    case 'double':return todo.some(a=>a.ksbs.some(k=>st.cov.has(k)))?1:2;
    case 'busy':{const today=new Date().toDateString();const t=activities.filter(a=>completed.has(a.id)&&doneAt[a.id]&&new Date(doneAt[a.id]).toDateString()===today).length;return Math.max(1,b.goal-t)}
    default:return left; /* activity counts, featured, looking through, KSB search */
  }
}
function closestBadges(st,n){
  return BADGES.filter(b=>b.val(st)<b.goal).map((b,i)=>({b,i,steps:stepsLeft(b,st),left:b.goal-b.val(st),ratio:b.val(st)/b.goal}))
    .filter(x=>x.steps<Infinity).sort((x,y)=>x.steps-y.steps||y.ratio-x.ratio||x.i-y.i).slice(0,n);
}

  const switching=!!detail;
  detail={id,key};
  if(switching)swapSidebar(detailMarkup(a));else{sb.innerHTML=detailMarkup(a);sb.scrollTop=0}
  document.body.classList.add('sb-open');
  if(mobileQ.matches)document.documentElement.classList.add('dp-lock');
  markActive();
  setTimeout(()=>sb.querySelector('.dp-close')?.focus({preventScroll:true}),switching?300:420);
}
function markActive(){
  $('stage')?.querySelectorAll('.act').forEach(el=>{const on=!!detail&&el.dataset.key===detail.key;el.classList.toggle('is-active',on);el.querySelector('.act-summary')?.setAttribute('aria-expanded',on)});
}
function closeDetail(instant,noFocus){
  if(!detail)return;const key=detail.key;detail=null;
  document.body.classList.remove('sb-open');document.documentElement.classList.remove('dp-lock');
  markActive();
  if(!noFocus)cardEl(key)?.querySelector('.act-summary')?.focus({preventScroll:true});
}
function detailClick(e){
  if(e.target.closest('[data-close]')){closeDetail();return}
  const btn=e.target.closest('[data-action]');if(!btn||!detail)return;
  const a=activities.find(x=>x.id===detail.id),act=btn.dataset.action;
  const focusFirst=sel=>()=>sb.querySelector(sel)?.focus({preventScroll:true});
  if(act==='ask')swapSidebar(detailMarkup(a,'confirm'),1,focusFirst('[data-action="yes"]'));
  else if(act==='no')swapSidebar(detailMarkup(a,'notyet'),1,focusFirst('[data-action="back"]'));
  else if(act==='back')swapSidebar(detailMarkup(a),-1,focusFirst('[data-action="ask"]'));
  else if(act==='yes'){
    primeAudio(); /* unlock audio inside the click so the chime can play */
    const before=statsFor(),beforeBadges=earned(before).map(b=>b.id);
    markDone(a.id,true);
    const after=statsFor();
    const win={ksbs:a.ksbs.filter(k=>!before.cov.has(k)),badges:earned(after).map(b=>b.id).filter(id=>!beforeBadges.includes(id)),before,after};
    lastWin=win;
    refreshDash();markActive();updateNavCount(true);
    swapSidebar(celebrateMarkup(a,win),1,()=>playCelebration(win));
  }
  else if(act==='progress'){closeDetail(true,true);setView('progress')}
  else if(act==='keep'){closeDetail()}
  else if(act==='undo')swapSidebar(detailMarkup(a,'unmark'),1,focusFirst('[data-action="keepdone"]'));
  else if(act==='keepdone')swapSidebar(detailMarkup(a),-1,focusFirst('[data-action="undo"]'));
  else if(act==='unmark'){
    markDone(a.id,false);refreshDash();markActive();
    swapSidebar(detailMarkup(a),-1,focusFirst('[data-action="ask"]'));
  }
}
function detailKey(e){if(e.key==='Escape'&&detail){e.preventDefault();closeDetail()}}

/* Glow behaviour: from Modium source, generalised to any number of branches. */
let introGlowTimers=[];
const glowEls=()=>$('stage').querySelectorAll('.route-glow');
function clearIntroGlowTimers(){introGlowTimers.forEach(t=>clearTimeout(t));introGlowTimers=[];glowEls().forEach(el=>el.classList.remove('is-travel'))}
function setIntroHighlight(mode=''){$('stage').querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('is-highlight',!!mode&&el.dataset.mode===mode))}
function setTravel(mode){glowEls().forEach(el=>el.classList.remove('is-travel'));void $('intro').offsetWidth;if(mode)$('stage').querySelector(`.route-glow[data-mode="${mode}"]`)?.classList.add('is-travel')}
/* Trail loops: each path lights in turn, then a pause before it repeats. Pauses while a button is hovered or focused. */
const LOOP_GAP=2500;let loopModes=[];
function playIntroBranchSequence(modes,firstDelay=300){loopModes=modes;clearIntroGlowTimers();setIntroHighlight('');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!modes.length)return;modes.forEach((mode,i)=>{introGlowTimers.push(setTimeout(()=>setTravel(mode),firstDelay+i*1300))});introGlowTimers.push(setTimeout(()=>setTravel(''),firstDelay+modes.length*1300));introGlowTimers.push(setTimeout(()=>playIntroBranchSequence(modes,0),firstDelay+modes.length*1300+LOOP_GAP))}
function resumeLoop(){if(!busy)playIntroBranchSequence(loopModes,1200)}

function bindChoices(step){
  $('stage').querySelectorAll('[data-start]').forEach(btn=>{
    const mode=btn.dataset.start;
    btn.addEventListener('mouseenter',()=>{if(busy)return;clearIntroGlowTimers();setIntroHighlight(mode)});
    btn.addEventListener('mouseleave',()=>{if(!busy){setIntroHighlight('');resumeLoop()}});
    btn.addEventListener('focus',()=>{if(busy)return;clearIntroGlowTimers();setIntroHighlight(mode)});
    btn.addEventListener('blur',()=>{if(!busy){setIntroHighlight('');resumeLoop()}});
    btn.addEventListener('click',()=>choose(step,mode));
  });
}

function choose(step,mode){
  if(busy)return;busy=true;
  if(!step.start)answers[step.id]=mode;
  clearIntroGlowTimers();setIntroHighlight(mode);
  stepIndex++;
  const next=stepIndex<steps.length?steps[stepIndex]:null;
  /* Hold the chosen branch lit for a beat, then follow it down. */
  setTimeout(()=>{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)goTo(()=>next?render(next):renderDone());
    else followBranch(mode,next);
  },300);
}

/* Zoom into the chosen button, then a branch drops from the bottom of it,
   and the view follows it down into the next question. */
function followBranch(mode,next){
  const intro=$('intro'),old=$('stage');
  const card=old.querySelector(`.choice[data-start="${mode}"]`);
  card.classList.add('is-chosen');card.blur();
  const or=old.getBoundingClientRect(),cr=card.getBoundingClientRect();
  const cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;
  const S=Math.max(1.08,Math.min(1.5,window.innerWidth*.8/cr.width));
  const targetX=window.innerWidth/2,targetY=window.innerHeight*.36;
  const Tx=targetX-cx,Ty=targetY-cy;
  old.style.transformOrigin=`${cx-or.left}px ${cy-or.top}px`;
  old.classList.add('is-departing');

  /* 1. Zoom into the button */
  old.style.transition='transform .65s cubic-bezier(.4,0,.2,1)';
  old.style.transform=`translate(${Tx}px,${Ty}px) scale(${S})`;

  /* Branch starts at the bottom-centre of the zoomed button */
  const ex=targetX,ey=targetY+S*cr.height/2;

  if(!next){dropIntoDashboard(old,ex,ey);return}
  const inc=document.createElement('div');
  inc.className='stage stage-incoming'+(next?'':' dash-incoming');
  inc.innerHTML=next?stepMarkup(next):doneMarkup();
  inc.style.transition='none';
  intro.appendChild(inc);
  const ir=inc.getBoundingClientRect();
  let tx,ty;const sn=inc.querySelector('.start-node');
  if(sn){const r=sn.getBoundingClientRect();tx=r.left+r.width/2;ty=r.top+r.height/2}
  else{const c=inc.querySelector('.intro-copy').getBoundingClientRect();tx=c.left+c.width/2;ty=c.top-30}
  const G=Math.round(Math.min(300,window.innerHeight*.38));
  const dx=tx-ex,dy=ty-(ey+G);

  const line=document.createElement('div');
  line.className='follow-line';
  line.style.left=(tx-ir.left)+'px';line.style.top=(ty-G-ir.top)+'px';line.style.height=G+'px';
  inc.appendChild(line);
  inc.style.transform=`translate(${-dx}px,${-dy}px)`;
  void inc.offsetWidth;

  /* 2. The branch drops from the button and the view follows it down */
  const ease='1.1s cubic-bezier(.65,0,.35,1)';
  setTimeout(()=>{
    old.style.transition=`transform ${ease}`;inc.style.transition=`transform ${ease}`;
    line.style.transition=`transform ${ease},opacity .45s ease`;
    old.style.transform=`translate(${Tx+dx}px,${Ty+dy}px) scale(${S})`;
    inc.style.transform='translate(0,0)';line.style.transform='scaleY(1)';
  },700);
  setTimeout(()=>old.classList.add('is-fading-trail'),1350);
  /* 3. The branch reaches the fork and splits into the new paths */
  setTimeout(()=>{
    inc.classList.add('node-in','is-arrived');
    if(next){
      inc.classList.add('is-splitting');
      line.style.transformOrigin='bottom';
      line.style.transition='transform .32s cubic-bezier(.4,0,1,1)';
      line.style.transform='scaleY(0)';
    }else{line.style.opacity='0';document.body.classList.add('is-light')}
  },1800);
  setTimeout(()=>{
    old.remove();line.remove();
    inc.classList.remove('stage-incoming','is-arrived','node-in','is-splitting');inc.style.transition='';inc.style.transform='';
    inc.id='stage';busy=false;
    if(next){bindChoices(next);if(!next.start)playIntroBranchSequence(next.options.map(o=>o.key),LOOP_GAP)}else{intro.classList.add('is-dash');bindDone()}
  },next?3150:2400);
}

/* Into the dashboard: the branch drops to the middle of the screen, then white floods out from its tip. */
function dropIntoDashboard(old,ex,ey){
  const intro=$('intro');
  const tipY=Math.round(window.innerHeight*.62),G=Math.max(120,tipY-ey);
  const line=document.createElement('div');
  line.className='follow-line';line.style.position='fixed';line.style.left=ex+'px';line.style.top=ey+'px';line.style.height=G+'px';line.style.zIndex=5;
  document.body.appendChild(line);
  const flood=document.createElement('div');flood.className='flood';
  flood.style.clipPath=`circle(0px at ${ex}px ${ey+G}px)`;
  document.body.appendChild(flood);
  const ease='.9s cubic-bezier(.65,0,.35,1)';
  const lift=Math.round(G*.45);
  line.style.transform='none';line.style.height='0px';
  setTimeout(()=>{
    /* Line top moves up with the button, line tip grows down to the same point, so it never detaches. */
    line.style.transition=`top ${ease},height ${ease}`;line.style.top=(ey-lift)+'px';line.style.height=(G+lift)+'px';
    const m=old.style.transform;old.style.transition=`transform ${ease}`;old.style.transform=`translateY(${-lift}px) ${m}`;
  },700);
  setTimeout(()=>old.classList.add('is-fading-trail'),1250);
  setTimeout(()=>{
    flood.style.transition='clip-path .75s cubic-bezier(.55,0,.25,1)';
    flood.style.clipPath=`circle(${Math.hypot(window.innerWidth,window.innerHeight)}px at ${ex}px ${ey+G}px)`;
  },1600);
  setTimeout(()=>{
    document.body.style.transition='none';document.body.classList.add('is-light');void document.body.offsetWidth;document.body.style.transition='';
    old.remove();line.remove();
    const st=document.createElement('div');st.className='stage is-entering';st.id='stage';
    intro.appendChild(st);intro.classList.add('is-dash');
    st.innerHTML=doneMarkup();window.scrollTo(0,0);
    void st.offsetWidth;st.classList.remove('is-entering');
    flood.style.transition='opacity .4s ease';flood.style.opacity='0';
    setTimeout(()=>flood.remove(),450);
    showNav();busy=false;bindDone();
  },2400);
}

function goTo(draw){
  const stage=$('stage');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  stage.classList.add('is-leaving');
  setTimeout(()=>{
    stage.classList.remove('is-leaving');stage.classList.add('is-entering');
    draw();
    void stage.offsetWidth;
    stage.classList.remove('is-entering');
    busy=false;
    stage.querySelector('button')?.blur();
  },reduce?0:400);
}

if(savedPrefs&&STYLE_LABELS[savedPrefs.style]&&WORK_LABELS[savedPrefs.autonomy]){
  answers.style=savedPrefs.style;answers.autonomy=savedPrefs.autonomy;stepIndex=steps.length;
  renderDone();
}else render(steps[0]);
</script>
</body>
</html>
